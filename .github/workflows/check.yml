name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Match the exact toolchain declared in go.mod; the linter cannot decode
          # the newer export-data format selected by a floating 1.27 minor.
          go-version: '1.27.0'
      - run: make fmt-check lint test build
      - run: go vet ./...
      - name: Package verified Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          make build VERSION=1.7.0-forgejo.2
          mkdir -p dist
          tar -czf dist/gitea-mcp_Linux_x86_64.tar.gz gitea-mcp
          sha256sum gitea-mcp dist/gitea-mcp_Linux_x86_64.tar.gz > dist/checksums.txt
          git rev-parse HEAD > dist/source-commit.txt
          go version -m gitea-mcp > dist/build-info.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitea-mcp-linux-amd64
          path: dist/
          if-no-files-found: error
